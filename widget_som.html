            max-width: 70px;
            max-height: 70px;
            min-width: 70px;
            min-height: 70px;
            margin-left: 8px;
        }
        div#chapa {
            background-image: linear-gradient(to bottom, rgb(75, 75, 90),rgb(70, 70, 90));
            border-radius: 10px; 
            box-shadow:  0px 1px 4px 1px rgba(0, 0, 0, 0.2);
            height: 40px;
            padding: 0px 6px 0px 6px;
            width: auto;
            position: relative;
            top: 12px;
            
        }
        p#titulo {
            position: relative;
            text-align: center;
            top: 10px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            font-family: "Eras-Demi";
            color: #fff;
            font-size: 17px;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.5);
        }
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(26, 23, 43, 0.336);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: black;
            border-radius: 10px;
            border: 3px solid rgba(26, 23, 43, 0.336);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(70, 66, 83, 0.966);
        }
        #conectados {
            padding:5px 5px 5px 5px;
            height: 230px;
            border-radius: 20px;
            background-image: linear-gradient(to bottom, rgb(50, 50, 70),rgb(25, 25, 35));
            box-shadow: inset  0px 1px 4px 2px rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .miembro {
            display: flex;
            margin: 5px;
            padding-top: 0px;
            padding-right: 5px;
            border-radius: 8px;
            border: inset 1px rgba(24, 25, 36, 0.5);
            background-color: rgba(70, 66, 83, 1);
            color: white;
            font-family: "Eras-Light"; 
            text-shadow:  0px 2px 2px 5px rgba(0, 0, 0, 0.8) ;
            box-shadow:  0px 1px 5px 1px rgba(0, 0, 0, 0.1) ;
            
        }
        span  {
            font-size: 12px;
            padding-top: 2px;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            top: 4px;
            width: auto;
        }
        .profesor {
            color: #ecd8cd;
            font-family: "Eras-Demi";
            border: inset 1px rgba(8, 9, 53, 0.5);
            background-color: rgba(49, 78, 158, 0.301);
        }
        .foto {
            border-radius: 50%;
            width: 22px;
            height: 22px;
            position: relative;
            top: 2px;
            margin-right: 5px;
            margin-left: 5px;
        }
        .estado {
            text-align: right;
            margin: 1px 5px 3px auto;
            vertical-align: middle;
            height: 17px;
            position: unset;
            padding-bottom: 3px;           
            font-size: 15px;
        }
        .online { color: mediumseagreen}
        .idle { color: gold}
        .dnd { color: darkred}
        .offline { color: slategray}
    </style>
</head>
<body>
    <div id="contenedor">
        <div id="cabecera">
            <div id="logo"></div>
            <div>
                <div id="chapa">
                    <p id="titulo">1ºSMR - SOM</p>
                </div>
            </div>
        </div>
        <div id="conectados"></div>
    </div>
    <script type="text/javascript">

        // Importante: introducir la ID del servidor, la función Widget debe de estár activada.
        const url_json = "https://discord.com/api/guilds/1417926765225054268/widget.json";
        
        const contenedor = document.getElementById("conectados");

        async function cargar_datos() {
           try {
                const paquete = await fetch(url_json);
                const datos = await paquete.json();

                contenedor.innerHTML = "";

                datos.members.forEach(member => {
                    if (member.username !== "DailyBot") {

                        const fila = document.createElement("div");

                        //Avatar
                        const avatar = document.createElement("img");
                        avatar.src = member.avatar_url;
                        avatar.className = "foto";
                        fila.appendChild(avatar);
                        
                        //Nombre
                        const nombre = document.createElement("span");
                        if (member.username === "José Manuel Escribano") {
                            nombre.textContent = "Profesor";
                            fila.className = "miembro profesor";
                            contenedor.prepend(fila);
                        }
                        else {
                          nombre.textContent = member.username;
                          fila.className = "miembro";
                          contenedor.appendChild(fila);  
                        }
                        fila.appendChild(nombre);

                        //ߔ堅stado
                        const estado = document.createElement("span");
                        switch (member.status) {
                            case "online":
                                estado.textContent = "⬤";
                                estado.className = "estado online";
                                break;
                            case "idle":
                                estado.textContent = "⬤";
                                estado.className = "estado idle";
                                break;
                            case "dnd":
                                estado.textContent = "⬤";
                                estado.className = "estado dnd";
                                break;
                            case "offline":
                                estado.textContent = "⬤";
                                estado.className = "estado offline";
                                break;
                        }
                        fila.appendChild(estado);

                        
                    }
                });
            } catch (error) {
                console.error("Error al cargar los datos:", error);
            }
        }
        cargar_datos();
        setInterval(cargar_datos, 10000);  //Aqui podemos cambiar el intervalo de actualización.
    </script>

</body>
</html>
